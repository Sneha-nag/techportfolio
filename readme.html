<!--
  One README viewer for every project. The Projects page links here with
  ?project=KEY. This file maps that key to a markdown file in assets/
  and to a title. The markdown is fetched and rendered in the browser
  with marked.js from a CDN.

  Why client-side markdown: GitHub Pages is static. A server-side render
  is not available. Alternatives would be committing pre-rendered HTML
  per project, or letting GitHub render the README on github.com. Those
  were not used. The code does not record why marked was chosen over
  another parser. Mermaid fences in the markdown are not rendered; they
  stay as code. Architecture is a JPG in the markdown, not a live diagram.

  Input: the query key. Output: a heading plus HTML from the markdown.
  An unknown key, or a failed fetch, replaces the status line and leaves
  the article empty. marked.parse writes innerHTML. The markdown files
  are authored in this repo, so the XSS risk is the same as trusting
  those files. A compromised CDN script would run on this page. The
  code does not vendor marked.js. Cost is the CDN request plus Pages.

  The title uses the normal h1 (Bricolage Grotesque), not the Allura
  script font. Allura is not loaded on this page.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>README · Sneha Nagabhairava</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="mark" href="index.html">SN</a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html">Resume</a>
          <a href="projects.html" aria-current="page">Projects</a>
          <a href="certifications.html">Certifications</a>
        </nav>
      </div>
    </header>

    <main id="content" class="wrap">
      <header class="hero">
        <p class="kicker">Project documentation</p>
        <h1 id="readme-title">README.md</h1>
        <p class="lede" id="readme-status">Loading…</p>
        <div class="actions">
          <a class="button ghost" href="projects.html">Back to projects</a>
        </div>
      </header>
      <article class="readme-body" id="readme-body"></article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script>
      // Keys must match the ?project= values on the Projects page.
      // A new project is invisible here until both maps and the markdown
      // file exist. Titles are separate from the markdown H1 so the page
      // heading can say "README.md" even when the file starts with a
      // different heading.
      const FILES = {
        youthmentalhealth: "assets/youthmentalhealth-README.md",
        civicpocket: "assets/civicpocket-README.md",
        "re-enterprise": "assets/re-enterprise-README.md",
        peacefulplaces: "assets/peacefulplaces-README.md",
        rootloop: "assets/rootloop-README.md",
      };
      const TITLES = {
        youthmentalhealth: "Youth mental health risk",
        civicpocket: "CivicPocket",
        "re-enterprise": "RE Enterprise Architecture RAG",
        peacefulplaces: "Peaceful Places",
        rootloop: "Rootloop",
      };
      const key = new URLSearchParams(location.search).get("project") || "";
      const src = FILES[key];
      const title = document.getElementById("readme-title");
      const status = document.getElementById("readme-status");
      const body = document.getElementById("readme-body");
      if (!src) {
        status.textContent = "Choose a project README from the Projects page.";
      } else {
        title.textContent = TITLES[key] + " README.md";
        fetch(src)
          .then((response) => {
            if (!response.ok) throw new Error("README not found");
            return response.text();
          })
          .then((markdown) => {
            status.hidden = true;
            body.innerHTML = marked.parse(markdown);
          })
          .catch(() => {
            status.textContent = "Could not load this README.";
          });
      }
    </script>
  </body>
</html>
